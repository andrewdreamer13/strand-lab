<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seite nicht gefunden — 404</title>
</head>
<body class="page-404">

  <div class="page-404__container">
    <div class="page-404__badge">Fehler 404</div>
    <h1 class="page-404__title">Hoppla! Seite nicht gefunden</h1>
    <p class="page-404__text">
      Möglicherweise liegt ein Tippfehler in der Adresse vor oder die Seite wurde verschoben.
      In <span class="page-404__counter" id="countdown">5</span> Sekunden werden Sie zur Startseite weitergeleitet.
    </p>
    <div class="page-404__actions">
      <a href="/de/" class="button page-404__button">Zur Startseite</a>
    </div>
  </div>

  <script type="module" src="/src/js/404.js"></script>
</body>
</html>
