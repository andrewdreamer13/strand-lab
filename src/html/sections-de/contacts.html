<section
  class="contacts"
  id="contacts"
>
  <div class="container">
    <header class="heading contacts__heading">
      <span class="heading__label">Kontakt</span>
      <h2 class="heading__title heading__title--de">Beginnen Sie mit einer Beratung</h2>
      <p class="heading__description">
        Erzählen Sie uns, was Sie am Zustand Ihres Haares stört. Wir bewerten Ihre 
        Situation und setzen uns mit Ihnen in Verbindung, um den optimalen Ansatz 
        für die Wiederherstellung zu besprechen.
      </p>
    </header>
    <div class="contacts__inner">
      <load
        class="form contacts__form"
        src="/src/html/components-de/form.html"
        id="contacts-form"
      />
      <div
        class="map-receiver contacts__map-receiver"
        data-map-receiver
        data-map-type="custom"
        data-map-id="strand-lab"
        data-map-lat="50.0826"
        data-map-lng="8.2435"
      ></div>
    </div>
  </div>
</section>
