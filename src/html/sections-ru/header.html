<header
  class="header"
  id="header"
>
  <div class="container">
    <div class="header__inner">
      <a
        class="logo"
        href="#hero"
      >
        <img
          class="logo__img"
          src="/src/assets/img/webp/logo.webp"
          alt="Логотип"
          width="52"
          height="60"
        />
        <span
          class="logo__text"
          translate="no"
          >strand lab</span
        >
      </a>
      <nav class="nav">
        <ul class="nav__list">
          <li class="nav__item">
            <a
              class="nav__link"
              data-text="Симптомы"
              href="#symptoms"
              >Симптомы</a
            >
          </li>
          <li class="nav__item">
            <a
              class="nav__link"
              data-text="Диагностика"
              href="#assessment"
              >Диагностика</a
            >
          </li>
          <li class="nav__item">
            <a
              class="nav__link"
              data-text="Процедуры"
              href="#treatments"
              >Процедуры</a
            >
          </li>
          <li class="nav__item">
            <a
              class="nav__link"
              data-text="Результаты"
              href="#results"
              >Результаты</a
            >
          </li>
          <li class="nav__item">
            <a
              class="nav__link"
              data-text="Вопросы"
              href="#questions"
              >Вопросы</a
            >
          </li>
          <li class="nav__item">
            <a
              class="nav__link"
              data-text="Контакты"
              href="#footer"
              >Контакты</a
            >
          </li>
        </ul>
      </nav>

      <div class="header__right">
        <div class="lang-switcher">
          <a
            href="%BASE_URL%"
            class="lang-switcher__link"
            hreflang="en"
            lang="en"
            >en</a
          >
          <span
            class="lang-switcher__divider"
            aria-hidden="true"
            >/</span
          >
          <a
            href="%BASE_URL%ru/"
            class="lang-switcher__link"
            hreflang="ru"
            lang="ru"
            >ru</a
          >
        </div>

        <load src="/src/html/components-ru/burger.html" />
      </div>
    </div>
  </div>
</header>
