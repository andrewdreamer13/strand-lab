<header
  class="header"
  id="header"
>
  <div class="container">
    <div class="header__inner">
      <a
        class="logo"
        href="#hero"
      >
        <img
          class="logo__img"
          src="/src/assets/img/webp/logo.webp"
          alt="Logo"
          width="52"
          height="60"
        />
        <span
          class="logo__text"
          translate="no"
          >strand lab</span
        >
      </a>
      <nav class="nav">
        <ul class="nav__list">
          <li class="nav__item">
            <a
              class="nav__link"
              data-text="Symptoms"
              href="#symptoms"
              >Symptoms</a
            >
          </li>
          <li class="nav__item">
            <a
              class="nav__link"
              data-text="Assessment"
              href="#assessment"
              >Assessment</a
            >
          </li>
          <li class="nav__item">
            <a
              class="nav__link"
              data-text="Treatments"
              href="#treatments"
              >Treatments</a
            >
          </li>
          <li class="nav__item">
            <a
              class="nav__link"
              data-text="Results"
              href="#results"
              >Results</a
            >
          </li>
          <li class="nav__item">
            <a
              class="nav__link"
              data-text="Questions"
              href="#questions"
              >Questions</a
            >
          </li>
          <li class="nav__item">
            <a
              class="nav__link"
              data-text="Contacts"
              href="#footer"
              >Contacts</a
            >
          </li>
        </ul>
      </nav>

      <div class="header__right">
        <div class="lang-switcher">
          <a
            href="%BASE_URL%"
            class="lang-switcher__link"
            hreflang="en"
            lang="en"
            >en</a
          >
          <span
            class="lang-switcher__divider"
            aria-hidden="true"
            >/</span
          >
          <a
            href="%BASE_URL%de/"
            class="lang-switcher__link"
            hreflang="de"
            lang="de"
            >de</a
          >
        </div>

        <load src="/src/html/components/burger.html" />
      </div>
    </div>
  </div>
</header>
