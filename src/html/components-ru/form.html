<form
  class="form {=$class}"
  id="{=$id}"
  action="https://api.web3forms.com/submit"
  method="POST"
  novalidate
  data-country="de"
  data-modal-success="modal-success"
>
  <input
    type="hidden"
    name="access_key"
    value="0d0b7a66-56f9-4ab4-a8f9-a92b96d45986"
  />

  <input
    type="checkbox"
    name="botcheck"
    hidden
  />

  <div class="form__input-box">
    <label
      class="form__label"
      for="name"
    >
      Ваше имя и фамилия <span class="form__required">*</span>
    </label>

    <input
      class="form__input"
      id="name"
      type="text"
      name="name"
      placeholder="Введите имя и фамилию"
      autocomplete="name"
      required
      aria-describedby="name-error"
    />

    <span
      class="form__error"
      id="name-error"
    ></span>
  </div>

  <div class="form__input-box">
    <label
      class="form__label"
      for="email"
    >
      Электронная почта <span class="form__required">*</span>
    </label>

    <input
      class="form__input"
      id="email"
      type="email"
      name="email"
      placeholder="Введите адрес электронной почты"
      autocomplete="email"
      required
      aria-describedby="email-error"
    />

    <span
      class="form__error"
      id="email-error"
    ></span>
  </div>

  <div class="form__input-box">
    <label
      class="form__label"
      for="phone"
    >
      Номер телефона <span class="form__optional">(необязательно)</span>
    </label>

    <input
      class="form__input"
      id="phone"
      type="tel"
      name="phone"
      placeholder="Введите номер телефона"
      autocomplete="tel"
      aria-describedby="phone-error"
    />

    <span
      class="form__error"
      id="phone-error"
    ></span>
  </div>

  <div class="form__input-box form__input-box--textarea">
    <label
      class="form__label"
      for="message"
    >
      Расскажите о состоянии ваших волос <span class="form__optional">(необязательно)</span>
    </label>

    <textarea
      class="form__textarea"
      id="message"
      name="message"
      rows="1"
      placeholder="Опишите, что вас беспокоит"
      aria-describedby="message-error"
    ></textarea>

    <span
      class="form__error"
      id="message-error"
    ></span>
  </div>

  <div class="form__input-box form__input-box--consent">
    <label
      class="form__consent-label"
      for="privacy-consent"
    >
      <input
        class="form__checkbox"
        id="privacy-consent"
        type="checkbox"
        name="privacy-consent"
        value="accepted"
        required
        aria-describedby="privacy-consent-error"
      />

      <span class="form__consent-text">
        Я ознакомился(-ась) с
        <a
          class="form__privacy-link"
          href="#!"
          target="_blank"
          rel="noopener noreferrer"
          >Политикой конфиденциальности</a
        >
        и согласен(-на) на обработку моих персональных данных.
      </span>
    </label>

    <span
      class="form__error"
      id="privacy-consent-error"
    ></span>
  </div>

  <button
    class="form__submit button"
    type="submit"
  >
    Записаться на консультацию
  </button>
</form>
