<div class="cookie-banner hidden" id="cookieBanner">

    <p class="cookie-banner__text">
      Мы используем файлы cookie, чтобы улучшить работу сайта и сделать
      ваше пребывание на нём удобнее.
      Нажимая «Принять», вы соглашаетесь с использованием файлов cookie.
    </p>
    <div class="cookie-banner__buttons">
      <button class="cookie-banner__btn cookie-banner__btn--decline" id="cookieDecline">Отклонить</button>
      <button class="cookie-banner__btn cookie-banner__btn--accept" id="cookieAccept">Принять все</button>
    </div>
  </div>
</div>
