<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Страница не найдена — 404</title>
</head>
<body class="page-404">

  <div class="page-404__container">
    <div class="page-404__badge">Ошибка 404</div>
    <h1 class="page-404__title">Упс! Страница не найдена</h1>
    <p class="page-404__text">
      Возможно, в адресе допущена ошибка или страница была перемещена.
      Через <span class="page-404__counter" id="countdown">5</span> секунд вы будете перенаправлены на главную страницу.
    </p>
    <div class="page-404__actions">
      <a href="/ru/" class="button page-404__button">На главную</a>
    </div>
  </div>

  <script type="module" src="/src/js/404.js"></script>
</body>
</html>
