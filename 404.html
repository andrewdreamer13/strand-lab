<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — 404</title>
</head>
<body class="page-404">

  <div class="page-404__container">
    <div class="page-404__badge">Error 404</div>
    <h1 class="page-404__title">Oops! Page not found</h1>
    <p class="page-404__text">
      Maybe there is a typo in the URL, or the page has been moved. 
      You will be redirected to the homepage in <span class="page-404__counter" id="countdown">5</span> seconds.
    </p>
    <div class="page-404__actions">
      <a href="%BASE_URL%" class="page-404__btn page-404__btn--primary">Back to Homepage</a>
    </div>
  </div>

  <script type="module" src="./src/js/404.js"></script>
</body>
</html>
